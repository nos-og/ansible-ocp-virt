---
- name: Create NetworkAttachmentDefinition
  hosts: localhost
  gather_facts: false

  vars:
    namespace: vm-project
    vlan_id: 100
    bridge: br1

  tasks:
    - name: Create NAD
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: k8s.cni.cncf.io/v1
          kind: NetworkAttachmentDefinition
          metadata:
            name: "vlan-{{ vlan_id }}"
            namespace: "{{ namespace }}"
          spec:
            config: |
              {
                "cniVersion": "0.3.1",
                "name": "vlan-{{ vlan_id }}",
                "type": "cnv-bridge",
                "bridge": "{{ bridge }}",
                "ipam": {}
              }
